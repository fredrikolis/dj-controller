# Concern: pins the exact rustc, rustfmt, clippy and the wasm32, Windows and macOS targets every clone builds and lints with | Non-concern: crate dependencies and their versions (Cargo.toml) | IO: none
[toolchain]
channel = "1.96.0"
components = ["rustfmt", "clippy"]
targets = ["wasm32-unknown-unknown", "x86_64-pc-windows-gnu", "aarch64-apple-darwin"]

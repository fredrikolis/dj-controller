# Concern: builds the demo on the dj-controller a release just published, installed from npm, and deploys it to Pages | Non-concern: the release, per-commit checks | IO: (release, dispatch) -> Pages
name: Pages

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      # After a release, the commit it released.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # npm served 0.1.0's tarball only minutes after its publish; an install before that fails with E404.
      - name: Wait for npm to serve the version the demo pins
        working-directory: demo
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').dependencies['dj-controller']")"
          tarball="https://registry.npmjs.org/dj-controller/-/dj-controller-$version.tgz"
          for attempt in $(seq 1 60); do
            if [ "$(npm view "dj-controller@$version" version 2>/dev/null)" = "$version" ] && curl --fail --silent --head "$tarball" >/dev/null; then
              exit 0
            fi
            echo "attempt $attempt of 60: npm does not serve dj-controller@$version yet"
            sleep 10
          done
          echo "::error::npm did not serve $tarball within 10 minutes; run this workflow again once it answers"
          exit 1
      - name: Install the demo with the published package
        working-directory: demo
        run: npm ci
      - working-directory: demo
        run: npm run check && npm test && npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: demo/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

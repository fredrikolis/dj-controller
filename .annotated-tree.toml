# Concern: the annotation rules and the crate DAG's deny edges | Non-concern: which paths the gate walks (.githooks/pre-commit) | IO: none

[rules]
# Explicit for reproducibility; requires annotated-tree >=0.7.0.
max_annotation_length = 200

require_package_charter = true
forbid_cycles = true
forbid_orphans = true

# The core is the leaf every transport stands on; no transport reaches into another.
deny = [
    ["dj-controller-core", "dj-controller"],
    ["dj-controller-core", "dj-controller-cli"],
    ["dj-controller", "dj-controller-cli"],
    ["dj-controller-cli", "dj-controller"],
    # The demo consumes the driver's npm package; the driver never reaches it.
    ["dj-controller", "dj-controller-demo"],
]

[languages.css]
extensions = [".css"]
block = ["/*", "*/"]

[languages.html]
extensions = [".html"]
block = ["<!--", "-->"]

<!-- Concern: the demo page's markup: connect, the twin, the deck, mixer, effects and sampler sections the features fill | Non-concern: behaviour (src/main.ts), look (assets/styles/page.css) | IO: none -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Two decks of scalable vector audio, played from a Pioneer DDJ-FLX10 over Web MIDI or from the page." />
    <title>dj-controller</title>
    <link rel="stylesheet" href="./assets/styles/page.css" />
    <script type="module" src="./src/main.ts"></script>
  </head>
  <body>
    <header>
      <button id="connect" type="button" disabled>Connect a DDJ-FLX10</button>
    </header>
    <p id="error" role="alert" hidden></p>
    <dj-controller-twin hidden></dj-controller-twin>
    <main id="desk">
      <section class="deck" data-deck="0" aria-label="deck 1" aria-busy="true"></section>
      <section class="mixer" aria-label="mixer"></section>
      <section class="deck" data-deck="1" aria-label="deck 2" aria-busy="true"></section>
      <section class="effects" aria-label="beat fx"></section>
      <section class="sampler" aria-label="sampler deck"></section>
    </main>
  </body>
</html>
